<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Processor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row">
      <!-- Left: Inputs, buttons, table -->
      <div class="col-12 col-md-8" style="height: 100%; overflow-y: scroll; max-height: 95vh;">
        <h3 class="mb-4">Track Processor</h3>
        <form class="mb-4">
          <div class="form-row">
            <div class="form-group col-md-6 col-lg-4">
              <label for="zipInput">Select a .zip of TCX or GPX files</label>
              <input type="file" class="form-control" id="zipInput" accept=".zip" />
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="pointInterval">Use every</label>
              <select class="form-control" id="pointInterval">
                <option value="1">point</option>
                <option value="2">2nd point</option>
                <option value="3">3rd point</option>
                <option value="4">4th point</option>
                <option value="5">5th point</option>
                <option value="6">6th point</option>
                <option value="7">7th point</option>
                <option value="8">8th point</option>
                <option value="9">9th point</option>
                <option value="10">10th point</option>
              </select>
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="unitsSelector">Units</label>
              <select class="form-control" id="unitsSelector">
                <option value="imperial">Freedom</option>
                <option value="metric">Metric</option>
              </select>
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="outputFormat">Output Format</label>
              <select class="form-control" id="outputFormat">
                <option value="tcx">TCX</option>
                <option value="gpx">GPX</option>
              </select>
            </div>
            <div class="form-group col-md-3 col-lg-2 d-flex align-items-end">
              <button class="btn btn-secondary w-100" id="refreshBtn" type="button">Refresh</button>
            </div>
          </div>
        </form>

        <div class="mb-3">
          <button class="btn btn-info mr-2" id="cleanFilesBtn" type="button">
            Remove Unnecessary Points
          </button>
          <button class="btn btn-primary mr-2" id="exportTrimmedBtn" type="button">
            Export Trimmed Files
          </button>
          <button class="btn btn-info" id="mergeFilesBtn" type="button">
            Merge Into One Activity
          </button>
        </div>

        <div id="progressContainer" class="mb-3" style="display: none;">
          <label>Progress</label>
          <div class="progress">
            <div
              class="progress-bar"
              role="progressbar"
              style="width: 0%;"
              aria-valuenow="0"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>
        </div>

        <div id="output"></div>

        <div class="mt-4">
          <button id="showRemovalsBtn" class="btn btn-secondary btn-sm mb-2" type="button">Show Removals Per File</button>
          <div id="previewContainer" style="display:none;"></div>
        </div>
      </div>
      <!-- Right: Map -->
      <div class="col-12 col-md-4 d-flex flex-column">
        <div id="map" style="height: 95vh; min-height: 400px; width: 100%;"></div>
      </div>
    </div>
  </div> <!-- .container-fluid -->

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="zip.js"></script>
</body>
</html>
