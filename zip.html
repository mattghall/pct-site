<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TCX/GPX Processor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
  <div class="container mt-4">
    <h3 class="mb-3">TCX/GPX File Processor</h3>

    <div class="form-group">
      <label for="zipInput">Select a .zip of TCX files</label>
      <input
        type="file"
        class="form-control-file"
        id="zipInput"
        accept=".zip"
      />
    </div>

    <div class="form-row align-items-end">
      <div class="form-group col-md-4">
        <label for="pointInterval">Use every</label>
        <select class="form-control" id="pointInterval">
          <option value="1">point</option>
          <option value="2">2nd point</option>
          <option value="3">3rd point</option>
          <option value="4">4th point</option>
          <option value="5">5th point</option>
          <option value="6">6th point</option>
          <option value="7">7th point</option>
          <option value="8">8th point</option>
          <option value="9">9th point</option>
          <option value="10">10th point</option>
        </select>
      </div>
      <div class="form-group col-md-2">
        <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
      </div>
      <div class="form-group col-md-3">
        <label for="unitsSelector">Units</label>
        <select class="form-control" id="unitsSelector">
          <option value="imperial">Freedom</option>
          <option value="metric">Metric</option>
        </select>
      </div>
      <div class="form-group col-md-3">
        <label for="outputFormat">Output Format</label>
        <select class="form-control" id="outputFormat">
          <option value="tcx">TCX</option>
          <option value="gpx">GPX</option>
        </select>
      </div>
    </div>


    <div class="form-group">
      <button class="btn btn-info mr-2" id="cleanFilesBtn">
        Remove Unnecessary Points
      </button>
      <button class="btn btn-primary mr-2" id="exportTrimmedBtn">
        Export Trimmed Files
      </button>
      <button class="btn btn-info" id="mergeFilesBtn">
        Merge Into One Activity
      </button>
    </div>

    <div id="progressContainer" class="mb-3" style="display: none;">
      <label>Progress</label>
      <div class="progress">
        <div
          class="progress-bar"
          role="progressbar"
          style="width: 0%;"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </div>

    <div id="output"></div>

    <hr />

    <div id="previewContainer"></div>
    <div class="mt-4">
      <h4>Track Preview</h4>
      <div id="map" style="height: 400px; width: 100%;"></div>
    </div>
  </div> <!-- .container -->

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="zip.js"></script>
</body>
</html>
